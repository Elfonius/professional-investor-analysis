<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Professional Investor Analysis</title>
  <desc id="desc">Evidence-led, multi-lens investment research for AI agents</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="0.55" stop-color="#0d1628"/>
      <stop offset="1" stop-color="#111d36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1120" cy="40" r="180" fill="#5eead4" opacity="0.04"/>
  <circle cx="1200" cy="300" r="220" fill="#818cf8" opacity="0.05"/>

  <rect x="64" y="58" width="6" height="204" rx="3" fill="url(#accent)"/>

  <text x="100" y="92" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">OPEN-SOURCE AGENT SKILL</text>
  <text x="100" y="152" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">Professional Investor Analysis</text>
  <text x="100" y="190" fill="#a8b3c7" font-family="Segoe UI, Arial, sans-serif" font-size="21">Evidence-led, multi-lens investment research for AI agents.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="100" y="218" width="116" height="34" rx="17" fill="#0f1b2e" stroke="#2c3a52"/>
    <text x="158" y="240" fill="#cbd5e1" text-anchor="middle">14 LENSES</text>
    <rect x="226" y="218" width="104" height="34" rx="17" fill="#0f1b2e" stroke="#2c3a52"/>
    <text x="278" y="240" fill="#cbd5e1" text-anchor="middle">16 STEPS</text>
    <rect x="340" y="218" width="118" height="34" rx="17" fill="#0f1b2e" stroke="#2c3a52"/>
    <text x="399" y="240" fill="#cbd5e1" text-anchor="middle">3 MODES</text>
    <rect x="468" y="218" width="154" height="34" rx="17" fill="#0f1b2e" stroke="#2c3a52"/>
    <text x="545" y="240" fill="#cbd5e1" text-anchor="middle">NO RUNTIME</text>
  </g>

  <g transform="translate(860 58)">
    <rect x="0" y="0" width="336" height="204" rx="14" fill="#0a1220" stroke="#26344c"/>
    <text x="24" y="34" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">EVIDENCE LEDGER</text>
    <line x1="24" y1="48" x2="312" y2="48" stroke="#26344c"/>

    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">
      <text x="24" y="76" fill="#5eead4">K1</text>
      <text x="58" y="76" fill="#cbd5e1">supply / float</text>
      <text x="268" y="76" fill="#5eead4">verified</text>

      <text x="24" y="106" fill="#5eead4">K2</text>
      <text x="58" y="106" fill="#cbd5e1">paid demand</text>
      <text x="268" y="106" fill="#fbbf24">claim</text>

      <text x="24" y="136" fill="#5eead4">K3</text>
      <text x="58" y="136" fill="#cbd5e1">exit depth</text>
      <text x="268" y="136" fill="#f87171">weak</text>

      <text x="24" y="166" fill="#5eead4">K4</text>
      <text x="58" y="166" fill="#cbd5e1">legal eligibility</text>
      <text x="268" y="166" fill="#94a3b8">n/a</text>
    </g>

    <path d="M24 184 C 90 184, 130 174, 180 176 S 260 160, 312 156" fill="none" stroke="url(#line)" stroke-width="2"/>
    <circle cx="312" cy="156" r="3" fill="#818cf8"/>
  </g>
</svg>
